services:
  kafka:
    image: apache/kafka:latest
    container_name: eventflow_kafka
    hostname: eventflow 
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL  # <-- ADD THIS LINE
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://eventflow:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@eventflow:29093  
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - eventflow-network

  # --- Веб-интерфейс AKHQ для управления Kafka ---
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8080:8080"
    environment:
      # Конфигурация AKHQ передается через переменную окружения [citation:2][citation:9]
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            my-kafka-cluster:
              properties:
                # Адрес брокера для подключения изнутри Docker-сети
                bootstrap.servers: "eventflow:29092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - eventflow-network
        
  # ============= REDIS =============
  redis:
    image: redis:7.2-alpine
    container_name: eventflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - eventflow-network    

  # ============= REDIS INSIGHT =============
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight_container
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/db
    environment:
      - REDIS_HOST=eventflow-redis
      - REDIS_PORT=6379
      - REDISINSIGHT_ACCEPT_LICENSE=true
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eventflow-network
  
  # ============= PROMETHEUS =============
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eventflow-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - eventflow-network  
  
  # ============= JAEGER =============
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: eventflow-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - eventflow-network  
  
  # ============= GRAFANA =============
  grafana:
    image: grafana/grafana:10.4.2
    container_name: eventapi-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - eventflow-network  

  # APIs
  users_api:
    build:
      context: .
      dockerfile: EventFlow.Users/dockerfile
    container_name: users_api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=eventflow-postgres;Port=5432;Database=${USERS_DB};Username=${DB_USER};Password=${DB_PASSWORD}"
      Otlp__Endpoint: http://eventflow-jaeger:4317 
    ports:
      - "5015:8080"
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - eventflow-network
  event_api:
    build:
      context: .
      dockerfile: EventFlow.Events/dockerfile
    container_name: events_api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=eventflow-postgres;Port=5432;Database=${EVENTS_DB};Username=${DB_USER};Password=${DB_PASSWORD}"
      KafkaOptions__BootstrapServers: eventflow:29092
      ConnectionStrings__Redis: eventflow-redis:6379
      Otlp__Endpoint: http://eventflow-jaeger:4317 
    ports:
      - "5025:8080"
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventflow-network
  booking_api:
    build:
      context: .
      dockerfile: EventFlow.Bookings/dockerfile
    container_name: booking_api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=eventflow-postgres;Port=5432;Database=${BOOKING_DB};Username=${DB_USER};Password=${DB_PASSWORD}"
      KafkaOptions__BootstrapServers: eventflow:29092
      Otlp__Endpoint: http://eventflow-jaeger:4317 
    ports:
      - "5035:8080"
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - eventflow-network
 
 # POSTGRES DB
  postgres_db:
    image: postgres:16-alpine
    container_name: eventflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres  # Стандартная БД для подключения
      # Переменные для создания дополнительных БД
      USERS_DB: ${USERS_DB}
      EVENTS_DB: ${EVENTS_DB}
      BOOKING_DB: ${BOOKING_DB}
    ports:
      - "${USERS_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${USERS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventflow-network
# ============= VOLUMES =============
volumes:
  pg_data:
  redis_data:
  redisinsight_data:
  kafka_data:
  grafana-data: 
# ============= NETWORKS =============
networks:
  eventflow-network:
    driver: bridge