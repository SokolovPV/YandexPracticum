# PostgreSQL для EventApi — совпадает с ConnectionStrings:DefaultConnection в appsettings.json
# Запуск из корня репозитория: docker compose up -d
# Остановка: docker compose down
# Данные сохраняются в именованном томе eventapi_pgdata

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventflow-user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventflow_userdb
    ports:
      - "5432:5432"
    volumes:
      - eventflow_userdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventflow_userdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eventapi_pgdata:
